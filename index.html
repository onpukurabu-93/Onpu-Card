<!-- 🔒 保護者専用メニュー画面 -->
<div id="screenParent" class="screen hidden">
  <div class="header">
    <!-- トップへ戻る際も暗証番号を再要求しないスムーズな遷移 -->
    <button class="btn btn-back" onclick="showScreen('screenTitle')">＜ トップへ戻る</button>
    <div class="header-title">🔒 保護者専用メニュー</div>
    <div></div>
  </div>

  <!-- ① 最上部に「対象プレイヤー切替」を配置 -->
  <div class="parent-player-select-box" style="background: #eef5ff; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center;">
    <label for="parentPlayerSelect" style="font-weight: bold; margin-right: 8px;">👤 対象プレイヤー：</label>
    <select id="parentPlayerSelect" onchange="switchParentPlayer(this.value)" style="padding: 6px 12px; font-size: 15px; border-radius: 6px; border: 1px solid #4A90E2;">
      <option value="0">ちゃたろう</option>
      <option value="1">くろまる</option>
      <option value="2">サブロー</option>
    </select>
  </div>

  <!-- ② 選択されたプレイヤーの個別レポート（切替で連動） -->
  <div class="report-card">
    <div class="report-title">💡 今週の声かけヒント</div>
    <div id="parentAdviceText" class="advice-box">
      「タイムが縮んだね！」「毎日続けていてすごい！」など、結果だけでなく練習の「継続」を褒めてあげるとやる気がUPします。
    </div>
  </div>

  <div class="report-card">
    <div class="report-title">📅 今週の練習記録（スタンプ・日数）</div>
    <div id="parentCalendarArea">
      <!-- 選択されたプレイヤーの練習記録が反映されるエリア -->
    </div>
  </div>

  <div class="report-card">
    <div class="report-title">📈 得意・苦手音符レポート</div>
    <div id="parentAnalysisReport">
      <!-- 選択されたプレイヤーの苦手分析が反映されるエリア -->
    </div>
  </div>

  <div class="report-card">
    <div class="report-title">🏅 今月の努力賞</div>
    <div class="certificate">
      <div class="certificate-title">今月の努力賞</div>
      <p id="certPlayerName" style="font-weight: bold; font-size: 16px;">ちゃたろう 殿</p>
      <p style="font-size: 13px; color: #555; margin-top: 4px;">今月も練習に励みました！その素晴らしい努力を称えます。</p>
    </div>
  </div>

  <!-- ③ プレイヤー全員（1〜3）の記録を一括比較できるエリア -->
  <div class="report-card" style="border-top: 2px solid #4A90E2; margin-top: 20px; padding-top: 15px;">
    <div class="report-title">👨‍👩‍👧‍👦 プレイヤー成績比較（一括）</div>
    <div id="parentSiblingComparison">
      <!-- 全プレイヤーのタイム・正答率などの比較一覧データ -->
    </div>
  </div>
</div>

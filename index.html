<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おんぷカード</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #f0f4f8;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 100vw;
    max-width: 600px;
    height: 100vh;
    max-height: 900px;
    background: #fff;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 100%;
    padding: 15px;
    position: absolute;
    top: 0; left: 0;
  }
  .active { display: flex; }
  
  /* ボタン装飾 */
  .btn {
    background: #4A90E2;
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    margin: 5px;
    width: 80%;
    max-width: 320px;
    text-align: center;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
  .btn-orange { background: #FF9500; }
  .btn-green { background: #34C759; }
  .btn-purple { background: #AF52DE; }
  .btn-red { background: #FF3B30; }

  /* 画面・表示固定エリア (練習・トレーニング) */
  .stage-area {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  
  /* 五線譜表示枠（表示倍率の最大化・固定） */
  .canvas-container {
    width: 98%;
    height: 280px;
    background: #fafafa;
    border: 2px solid #ddd;
    border-radius: 12px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100%;
    height: 100%;
  }

  /* 答え・マスク枠 */
  .answer-mask-box {
    width: 98%;
    height: 70px;
    margin-top: 10px;
    background: #eef2f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    position: relative;
  }
  .mask-active {
    background: #333;
    color: transparent;
  }

  /* 鍵盤・回答ボタンエリア */
  .keyboard-area {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .key-btn {
    width: 55px;
    height: 50px;
    background: #fff;
    border: 2px solid #4A90E2;
    color: #4A90E2;
    font-size: 20px;
    font-weight: bold;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .key-btn:active { background: #4A90E2; color: #fff; }

  /* モーダル・保護者エリア */
  .modal {
    display: none;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 450px;
    max-height: 85vh;
    overflow-y: auto;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 14px; }
  th { background: #f0f0f0; }
</style>
</head>
<body>

<div class="container">

  <!-- 表紙画面 -->
  <div id="home-screen" class="screen active">
    <h1 style="margin-top:20px; color:#4A90E2;">おんぷカード</h1>
    
    <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <button class="btn btn-purple" onclick="start6DoLesson()">6つの「ド」をおぼえる</button>
      <button class="btn" onclick="openModeMenu('treble')">ト音記号</button>
      <button class="btn" onclick="openModeMenu('bass')">ヘ音記号</button>
      <button class="btn btn-orange" onclick="openModeMenu('all')">全カード</button>
      <button class="btn btn-green" onclick="startChallenge()">今月のチャレンジ</button>
    </div>

    <button class="btn" style="background:#6c757d; margin-bottom:20px;" onclick="showRanking()">成績ランキングを見る</button>
  </div>

  <!-- メインプレイ画面 (練習 / トレーニング) -->
  <div id="play-screen" class="screen">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
      <button onclick="goHome()" style="padding:6px 12px; border-radius:12px; border:none; background:#ccc;">もどる</button>
      <span id="stage-title" style="font-weight:bold; font-size:18px;">トレーニング</span>
      <span id="score-display" style="font-weight:bold;">0 / 10</span>
    </div>

    <div class="stage-area">
      <!-- 五線譜描画キャンバス -->
      <div class="canvas-container">
        <canvas id="noteCanvas" width="500" height="280"></canvas>
      </div>
      <!-- 答え表示・マスク部分 -->
      <div id="answer-box" class="answer-mask-box">
        <span id="answer-text">ド</span>
      </div>
    </div>

    <!-- 音符入力キー -->
    <div class="keyboard-area" id="keyboard">
      <div class="key-btn" onclick="inputNote('ド')">ド</div>
      <div class="key-btn" onclick="inputNote('レ')">レ</div>
      <div class="key-btn" onclick="inputNote('ミ')">ミ</div>
      <div class="key-btn" onclick="inputNote('ファ')">ファ</div>
      <div class="key-btn" onclick="inputNote('ソ')">ソ</div>
      <div class="key-btn" onclick="inputNote('ラ')">ラ</div>
      <div class="key-btn" onclick="inputNote('シ')">シ</div>
    </div>
  </div>

  <!-- 成績ランキング＆保護者画面モーダル -->
  <div id="ranking-modal" class="modal">
    <div class="modal-content">
      <h2>成績ランキング</h2>
      <div id="ranking-list">
        <p>プレイヤー1: 練習日数 5日 | 最高記録 95点</p>
      </div>
      <hr style="margin:15px 0;">
      <button class="btn btn-purple" onclick="openParentArea()">保護者専用ページ</button>
      <button class="btn" style="background:#aaa; margin-top:10px;" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <!-- 保護者認証・比較モーダル -->
  <div id="parent-modal" class="modal">
    <div class="modal-content">
      <h3>保護者専用エリア</h3>
      <div id="parent-auth">
        <p>パスワードを入力してください (初期: 1234)</p>
        <input type="password" id="parent-pass" style="font-size:18px; width:80%; padding:5px; text-align:center;"><br><br>
        <button class="btn btn-green" onclick="checkParentPass()">解除</button>
      </div>
      <div id="parent-dashboard" style="display:none;">
        <h4>お子様の学習・比較データ</h4>
        <table>
          <thead>
            <tr><th>プレイヤー</th><th>総練習時間</th><th>得意音符</th><th>苦手音符</th></tr>
          </thead>
          <tbody id="parent-table-body">
            <tr><td>お子様A</td><td>120分</td><td>ド・ミ・ソ</td><td>シ（ヘ音記号）</td></tr>
            <tr><td>お子様B</td><td>45分</td><td>ド・レ</td><td>ファ・ラ</td></tr>
          </tbody>
        </table>
        <p style="font-size:12px; color:#666; margin-top:10px;">※複数プレイヤーの比較により、それぞれの成長スピードや苦手の傾向がひと目で分かります。</p>
      </div>
      <br>
      <button class="btn" style="background:#aaa;" onclick="closeParentModal()">閉じる</button>
    </div>
  </div>

</div>

<script>
// Web Audio API 音声合成処理
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPitch(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1.2);
}

// 画面切り替え
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// キャンバス描画 (ヘ音記号の大文字ラから高音まで画面いっぱいに表示)
const canvas = document.getElementById('noteCanvas');
const ctx = canvas.getContext('2d');

function drawStaff(clef = 'treble', notePitch = 0) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 五線譜の描画
  const startY = 100;
  const lineSpacing = 16;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;

  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(40, startY + i * lineSpacing);
    ctx.lineTo(canvas.width - 40, startY + i * lineSpacing);
    ctx.stroke();
  }

  // 記号（音源イメージ）描画
  ctx.font = '36px Arial';
  ctx.fillStyle = '#111';
  if (clef === 'treble') {
    ctx.fillText('𝄞', 50, startY + 52);
  } else {
    ctx.fillText('𝄢', 50, startY + 32);
  }

  // 音符の描画 (画面内に収まるスケーリング)
  const noteX = canvas.width / 2;
  const noteY = startY + 32 - (notePitch * (lineSpacing / 2));

  ctx.beginPath();
  ctx.ellipse(noteX, noteY, 10, 8, -Math.PI / 8, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();

  // 符幹
  ctx.beginPath();
  ctx.moveTo(noteX + 9, noteY);
  ctx.lineTo(noteX + 9, noteY - 45);
  ctx.lineWidth = 2;
  ctx.stroke();

  // 加線処理 (低い音・高い音)
  if (notePitch <= -2) { // 下加線
    for (let p = -2; p >= notePitch; p -= 2) {
      const ly = startY + 32 - (p * (lineSpacing / 2));
      ctx.beginPath();
      ctx.moveTo(noteX - 18, ly);
      ctx.lineTo(noteX + 18, ly);
      ctx.stroke();
    }
  }
}

// 練習・音符入力関係
let currentChallengeIndex = 0;
let isChallengeMode = false;
// 「あき（文部省唱歌）」メロディ配列
const songAki = [
  'ソ','ラ','シ','ド','ラ','ソ','ミ','ファ','ソ','レ','ミ','ド',
  'ソ','ラ','シ','ド','ラ','ソ','ミ','ソ','ラ','シ','ド',
  'ソ','ラ','シ','ド','ラ','ソ','ミ','ファ','ソ','レ','ミ','ド'
];

function startChallenge() {
  isChallengeMode = true;
  currentChallengeIndex = 0;
  showScreen('play-screen');
  document.getElementById('stage-title').innerText = '今月のチャレンジ：「あき」';
  loadChallengeNote();
}

function loadChallengeNote() {
  const note = songAki[currentChallengeIndex];
  document.getElementById('score-display').innerText = `${currentChallengeIndex + 1} / ${songAki.length}`;
  document.getElementById('answer-text').innerText = note;
  document.getElementById('answer-box').classList.add('mask-active'); // 答え隠し
  drawStaff('treble', 2);
}

function inputNote(noteName) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playPitch(440); // 簡易発音

  if (isChallengeMode) {
    if (noteName === songAki[currentChallengeIndex]) {
      currentChallengeIndex++;
      if (currentChallengeIndex >= songAki.length) {
        alert('「あき」をさいごまで えんそう できたよ！おめでとう！');
        goHome();
      } else {
        loadChallengeNote();
      }
    }
  }
}

function start6DoLesson() {
  alert('6つの「ド」をおぼえるレッスンをスタートします！');
  showScreen('play-screen');
  document.getElementById('stage-title').innerText = '6つのド';
  drawStaff('treble', 0);
  document.getElementById('answer-text').innerText = 'ド';
  document.getElementById('answer-box').classList.remove('mask-active');
}

function openModeMenu(mode) {
  showScreen('play-screen');
  document.getElementById('stage-title').innerText = mode === 'treble' ? 'ト音記号' : (mode === 'bass' ? 'ヘ音記号' : '全カード');
  drawStaff(mode === 'bass' ? 'bass' : 'treble', mode === 'bass' ? -6 : 0); // ヘ音記号の低い音（大文字ラ）にも対応
}

function goHome() {
  isChallengeMode = false;
  showScreen('home-screen');
}

function showRanking() {
  document.getElementById('ranking-modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('ranking-modal').style.display = 'none';
}

function openParentArea() {
  closeModal();
  document.getElementById('parent-modal').style.display = 'flex';
}
function closeParentModal() {
  document.getElementById('parent-modal').style.display = 'none';
  document.getElementById('parent-auth').style.display = 'block';
  document.getElementById('parent-dashboard').style.display = 'none';
}

function checkParentPass() {
  const pass = document.getElementById('parent-pass').value;
  if (pass === '1234') {
    document.getElementById('parent-auth').style.display = 'none';
    document.getElementById('parent-dashboard').style.display = 'block';
  } else {
    alert('パスワードが違います');
  }
}

// 初期化
drawStaff('treble', 0);
</script>
</body>
</html>

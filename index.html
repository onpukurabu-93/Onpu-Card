<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Onpu Cards - 音符カード（ピアノ教室用教具）</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background-color: #f0f4f8;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      background-color: #34495e;
      color: white;
      text-align: center;
      padding: 12px 0;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }
    .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
    .screen.active { display: flex; }

    .btn {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
      text-align: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background-color: #e74c3c; color: white; }
    .btn-secondary { background-color: #1abc9c; color: white; }
    .btn-admin { background-color: #7f8c8d; color: white; margin-top: 15px; }

    .card-display-area {
      width: 100%;
      height: 52vh;
      max-height: 440px;
      background-color: #ffffff;
      border: 3px solid #2c3e50;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin: 10px 0;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .card-display-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cloud-container {
      position: relative;
      width: 180px;
      height: 110px;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cloud-svg { width: 100%; height: 100%; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15)); }
    .cloud-number {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: 900;
      color: #e67e22;
      text-shadow: 2px 2px 0px #fff;
    }

    .keyboard-container { display: flex; justify-content: space-between; width: 100%; margin-top: 8px; }
    .key-btn {
      flex: 1; margin: 0 2px; padding: 18px 0; border: none; border-radius: 8px;
      font-size: 1.1rem; font-weight: bold; color: white; box-shadow: 0 3px 5px rgba(0,0,0,0.2);
    }
    .key-do { background-color: #e74c3c; }
    .key-re { background-color: #e67e22; }
    .key-mi { background-color: #f1c40f; color: #333; }
    .key-fa { background-color: #2ecc71; }
    .key-so { background-color: #1abc9c; }
    .key-la { background-color: #2980b9; }
    .key-si { background-color: #8e44ad; }

    .result-box {
      background: white; border-radius: 16px; padding: 20px; width: 100%;
      text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px;
    }
    .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; }
    .badge-perfect { background-color: #f1c40f; color: #000; font-size: 1.3rem; }
    .badge-great { background-color: #e74c3c; color: #fff; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>Onpu Cards（ピアノ教室用教具）</header>

  <div class="container">

    <!-- 1. トップ画面 -->
    <div id="screen-top" class="screen active">
      <h2 style="margin: 15px 0;">せいとさんをえらんでね</h2>
      
      <div style="width:100%; margin-bottom: 20px;">
        <select id="player-select" style="width:100%; padding:12px; font-size:1.1rem; border-radius:8px; border:2px solid #bdc3c7;">
          <option value="ちゃたろう">ちゃたろう</option>
          <option value="くろまる">くろまる</option>
          <option value="サブロー">サブロー</option>
        </select>
      </div>

      <!-- 10問スタートに固定 -->
      <button class="btn btn-primary" onclick="startCourse(10)">10問コース スタート</button>
      <button class="btn btn-secondary" onclick="startCourse(20)">20問コース スタート</button>

      <button class="btn btn-admin" onclick="openAdmin()">🔒 管理・設定（先生用）</button>
    </div>

    <!-- 2. レベル表紙 -->
    <div id="screen-level-splash" class="screen">
      <h2 id="course-title-display">10問コース</h2>
      
      <div class="cloud-container">
        <svg class="cloud-svg" viewBox="0 0 24 24" fill="#E0F7FA">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
        <div id="cloud-level-number" class="cloud-number">1</div>
      </div>

      <p style="font-size: 1.2rem; font-weight: bold;">レベル <span id="splash-level-num">1</span> 開始！</p>
    </div>

    <!-- 3. メイン練習画面 -->
    <div id="screen-game" class="screen">
      <div style="display:flex; justify-content:space-between; width:100%; font-weight:bold; margin-bottom:5px;">
        <span id="game-progress">問題 1 / 10</span>
        <span id="game-timer">0.0s</span>
      </div>

      <div class="card-display-area">
        <img id="cardImage" src="" alt="音符カード">
      </div>

      <div class="keyboard-container">
        <button class="key-btn key-do" onclick="handleAnswer('ド')">ド</button>
        <button class="key-btn key-re" onclick="handleAnswer('レ')">レ</button>
        <button class="key-btn key-mi" onclick="handleAnswer('ミ')">ミ</button>
        <button class="key-btn key-fa" onclick="handleAnswer('ファ')">ファ</button>
        <button class="key-btn key-so" onclick="handleAnswer('ソ')">ソ</button>
        <button class="key-btn key-la" onclick="handleAnswer('ラ')">ラ</button>
        <button class="key-btn key-si" onclick="handleAnswer('シ')">シ</button>
      </div>
    </div>

    <!-- 4. 結果画面 -->
    <div id="screen-result" class="screen">
      <h2>けっか はっぴょう</h2>
      <div class="result-box">
        <div id="result-badge-area"></div>
        <p style="font-size: 1.2rem; margin: 10px 0;">せいとうりつ: <strong id="result-accuracy">0%</strong></p>
        <p style="font-size: 1.1rem; color: #7f8c8d;">タイム: <span id="result-time">0.0秒</span></p>
      </div>

      <button id="btn-next-level" class="btn btn-primary" onclick="nextLevelAction()">次のレベルへ！</button>
      <button id="btn-to-20course" class="btn btn-secondary" style="display:none;" onclick="startCourse(20)">次は20問で頑張って！🚀</button>
      <button id="btn-voice-stage" class="btn btn-primary" style="display:none; background:#8e44ad;" onclick="showScreen('screen-voice')">🚀 次のステージへ！（口頭回答）</button>
      <button class="btn btn-admin" onclick="showScreen('screen-top')">トップへもどる</button>
    </div>

    <!-- 5. 声で答えるステージ -->
    <div id="screen-voice" class="screen">
      <h2>🎤 声でこたえよう！</h2>
      <p style="margin-top:5px; color:#555;">ド・レ・ミでうたってみてね！</p>
      <div class="card-display-area" style="height:30vh;">
        <div style="text-align:center;">
          <p style="font-size:1.2rem; font-weight:bold;">課題曲：チューリップ</p>
        </div>
      </div>
      <button class="btn btn-admin" onclick="showScreen('screen-top')">トップに戻る</button>
    </div>

  </div>

  <script>
    async function unlockAudio() {
      if (Tone.context.state !== 'running') {
        await Tone.start();
      }
    }

    const pianoSynth = new Tone.PolySynth(Tone.Synth, {
      oscillator: { type: "triangle" },
      envelope: { attack: 0.005, decay: 1.2, sustain: 0, release: 1.2 }
    }).toDestination();

    const noteToPitch = { 'ド': 'C4', 'レ': 'D4', 'ミ': 'E4', 'ファ': 'F4', 'ソ': 'G4', 'ラ': 'A4', 'シ': 'B4' };

    /* 先生のカード画像リスト構造（固定） */
    const cardsData = [
      { name: 'ド', src: 'do.png' },
      { name: 'レ', src: 're.png' },
      { name: 'ミ', src: 'mi.png' },
      { name: 'ファ', src: 'fa.png' },
      { name: 'ソ', src: 'so.png' },
      { name: 'ラ', src: 'la.png' },
      { name: 'シ', src: 'si.png' }
    ];

    function playPianoSound(note) {
      unlockAudio();
      const pitch = noteToPitch[note] || 'C4';
      pianoSynth.triggerAttackRelease(pitch, '8n');
    }

    // 初期コースは10問でスタート
    let currentCourse = 10;
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let startTime = 0;
    let timerInterval = null;
    let currentCard = null;

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function openAdmin() {
      const pwd = prompt("先生用のパスワードを入力してください:");
      if (pwd === "1234") {
        alert("認証成功：生徒名の管理・書き換えが可能です。");
      } else if (pwd !== null) {
        alert("パスワードが違います。");
      }
    }

    async function startCourse(numQuestions = 10) {
      await unlockAudio();
      currentCourse = numQuestions;
      currentLevel = 1;
      showLevelSplash();
    }

    function showLevelSplash() {
      document.getElementById('course-title-display').innerText = `${currentCourse}問コース`;
      document.getElementById('cloud-level-number').innerText = currentLevel;
      document.getElementById('splash-level-num').innerText = currentLevel;
      showScreen('screen-level-splash');

      setTimeout(() => {
        startGame();
      }, 1500);
    }

    function startGame() {
      currentQuestionIndex = 0;
      correctCount = 0;
      showScreen('screen-game');
      startTime = Date.now();
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 100);
      nextQuestion();
    }

    function updateTimer() {
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      document.getElementById('game-timer').innerText = `${elapsed}s`;
    }

    function nextQuestion() {
      if (currentQuestionIndex >= currentCourse) {
        finishGame();
        return;
      }
      currentQuestionIndex++;
      document.getElementById('game-progress').innerText = `問題 ${currentQuestionIndex} / ${currentCourse}`;
      
      currentCard = cardsData[Math.floor(Math.random() * cardsData.length)];
      const imgElem = document.getElementById('cardImage');
      imgElem.src = currentCard.src;
    }

    function handleAnswer(selectedNote) {
      if (selectedNote === currentCard.name) {
        correctCount++;
        playPianoSound(selectedNote);
      }
      nextQuestion();
    }

    function finishGame() {
      clearInterval(timerInterval);
      const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
      const accuracy = Math.round((correctCount / currentCourse) * 100);

      document.getElementById('result-accuracy').innerText = `${accuracy}%`;
      document.getElementById('result-time').innerText = `${elapsedTime}秒`;

      const badgeArea = document.getElementById('result-badge-area');
      badgeArea.innerHTML = '';

      if (accuracy === 100) {
        badgeArea.innerHTML = '<span class="badge badge-perfect">🎉 100% パーフェクト！ 🎉</span>';
      } else if (accuracy >= 90) {
        badgeArea.innerHTML = '<span class="badge badge-great">✨ やったね！90%たっせい！ ✨</span>';
      } else {
        badgeArea.innerHTML = '<span class="badge" style="background:#bdc3c7;">もうすこし！がんばろう！</span>';
      }

      const btnNext = document.getElementById('btn-next-level');
      const btn20 = document.getElementById('btn-to-20course');
      const btnVoice = document.getElementById('btn-voice-stage');

      btnNext.style.display = 'none';
      btn20.style.display = 'none';
      btnVoice.style.display = 'none';

      if (accuracy >= 90) {
        if (currentLevel < 5) {
          btnNext.style.display = 'block';
        } else {
          if (currentCourse === 10) {
            btn20.style.display = 'block';
          } else {
            btnVoice.style.display = 'block';
          }
        }
      }

      showScreen('screen-result');
    }

    function nextLevelAction() {
      currentLevel++;
      showLevelSplash();
    }
  </script>
</body>
</html>
